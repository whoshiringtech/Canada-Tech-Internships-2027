name: Update list
on:
  schedule:
    - cron: "30 3,9,15,21 * * *" # 30 min after each whoshiringtech.com refresh
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: build
        run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "whoshiring-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git diff --cached --quiet || (git commit -m "Update jobs $(date -u +%F)" && git push)
      - name: Heads-up when 2028 jobs appear (opens one issue, once)
        if: steps.build.outputs.count2028 != '0' && steps.build.outputs.count2028 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.build.outputs.count2028 }}
          LIST: ${{ steps.build.outputs.list2028 }}
        run: |
          TITLE="2028 jobs are showing up: time to start the 2028 repo"
          SEEN=$(gh issue list --state all --limit 1000 --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$SEEN" = "0" ]; then
            printf '%s Canadian internship or new grad jobs now mention 2028. Time to start the 2028 list repo.\n\nFirst ones seen:\n%s\n' "$COUNT" "$LIST" > body.md
            gh issue create --title "$TITLE" --body-file body.md
          fi
