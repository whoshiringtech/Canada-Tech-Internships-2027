name: Update list
on:
  schedule:
    - cron: "30 3,9,15,21 * * *" # 30 min after each whoshiringtech.com refresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "whoshiring-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update jobs $(date -u +%F)" && git push)
